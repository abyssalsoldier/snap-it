# Builds the setup .exe, .msi and portable .zip on every push to master and publishes them
# as the GitHub release for the workspace version (vX.Y.Z from Cargo.toml).
#
# - Version not released yet: creates the release (and the tag, if you did not push one).
# - Version already released: the files are kept as this run's artifacts only, so a later
#   push without a version bump never replaces published downloads.
#
# Optional code signing: add repository secrets SIGN_PFX_BASE64 (the .pfx, base64) and
# SIGN_PFX_PASSWORD. Without them the builds are unsigned.

name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      DOTNET_ROLL_FORWARD: Major
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install packaging tools (WiX v5, Inno Setup 6)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2 --add-source https://api.nuget.org/v3/index.json
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }

      - name: Build and package
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          $sign = @{}
          if ($env:SIGN_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
            $sign.PfxPath = $pfx
            $sign.PfxPassword = ConvertTo-SecureString $env:SIGN_PFX_PASSWORD -AsPlainText -Force
          }
          try { ./scripts/package.ps1 @sign }
          finally { if ($sign.PfxPath) { Remove-Item $sign.PfxPath -Force -ErrorAction SilentlyContinue } }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: snapit-packages
          path: |
            dist/SnapIt-*
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "::notice::$tag is already released; packages are attached to this run only. Bump the version to publish a new release."
            exit 0
          }
          # Release notes: this version's CHANGELOG section, else [Unreleased].
          $log = Get-Content CHANGELOG.md -Raw
          $section = foreach ($h in @([regex]::Escape("[$version]"), '\[Unreleased\]')) {
            $m = [regex]::Match($log, "(?ms)^## $h[^\n]*\n(.*?)(?=^## |\z)")
            if ($m.Success -and $m.Groups[1].Value.Trim()) { $m.Groups[1].Value.Trim(); break }
          }
          $notes = @"
          $section

          ### Downloads
          - **SnapIt-$version-setup-x64.exe**: installer (per user, no admin rights needed; Start menu shortcut)
          - **SnapIt-$version-x64.msi**: the same as an MSI package
          - **SnapIt-$version-portable-x64.zip**: no install; settings and screenshots stay in the folder

          SHA-256 checksums are in SHA256SUMS.txt.
          "@
          $notesFile = Join-Path $env:RUNNER_TEMP "notes.md"
          $notes | Set-Content $notesFile
          $files = @(Get-ChildItem dist -Filter "SnapIt-$version-*" | ForEach-Object FullName) + "dist/SHA256SUMS.txt"
          # Uses the tag if you pushed one, otherwise creates it on this commit.
          gh release create $tag @files --target $env:GITHUB_SHA --title "Snap It $version" --notes-file $notesFile
          if ($LASTEXITCODE) { throw "gh release create failed" }
