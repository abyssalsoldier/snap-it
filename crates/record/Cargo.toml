[package]
name = "snapit-record"
description = "In-process screen recording (Windows.Graphics.Capture + Media Foundation / GIF) for Snap It"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
snapit-gfx = { path = "../gfx" }
gif = "0.13"
windows = { version = "0.61", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
] }

[lints]
workspace = true
