[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"

[profile.release]
# Plain, unpacked binary: no UPX or obfuscation (EDR-safety rule).
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"

[workspace.lints.clippy]
# GUI builder helpers legitimately take many positional layout arguments.
too_many_arguments = "allow"
type_complexity = "allow"


# Optimise dependencies (tiny-skia, image…) even in debug builds so dev runs feel real.
[profile.dev.package."*"]
opt-level = 3
